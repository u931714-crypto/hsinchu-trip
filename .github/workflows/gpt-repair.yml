name: GPT QA Triage and Repair

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Hsinchu Trip QA and Deploy"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: gpt-qa-repair-${ github.event.workflow_run.id }
  cancel-in-progress: false

jobs:
  verify-openai-api:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verify API key and model access
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing or unavailable."
            exit 1
          fi
          code=$(curl --silent --show-error --output response.json --write-out "%{http_code}" https://api.openai.com/v1/responses -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" -d '{"model":"gpt-6.2-astra","input":"Reply with exactly: API_OK","max_output_tokens":20,"store":false}')
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::OpenAI API verification failed with HTTP $code"
            python3 -c 'import json; d=json.load(open("response.json")); print(json.dumps(d.get("error",d),ensure_ascii=False)[:3000])' || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open("response.json"))
          out="".join(c.get("text","") for i in d.get("output",[]) if i.get("type")=="message" for c in i.get("content",[]) if c.get("type")=="output_text").strip()
          print("OpenAI Responses API verified; response:",out)
          if "API_OK" not in out: raise SystemExit("Unexpected model response")
          PY
          echo "## OpenAI API verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Responses API authentication and model access succeeded." >> "$GITHUB_STEP_SUMMARY"

  diagnose-and-open-repair-pr:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the failed commit
        uses: actions/checkout@v4
        with:
          ref: ${ github.event.workflow_run.head_sha }
          fetch-depth: 0

      - name: Download the failed run's QA artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${ secrets.GITHUB_TOKEN }
          run-id: ${ github.event.workflow_run.id }
          name: qa-report-10-runs
          path: qa-input

      - name: Build compact diagnosis context
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("qa-input")
          reports=[]
          for p in sorted(root.rglob("*.json")):
              try: reports.append(json.loads(p.read_text(encoding="utf-8")))
              except Exception: pass
          logs=[]
          for p in sorted(root.rglob("*.log")):
              logs.append(f"\n===== {p.name} =====\n"+p.read_text(errors="replace")[-10000:])
          errors=[]
          for r in reports:
              for e in r.get("errors",[]):
                  errors.append({"run":r.get("run"),"test":e.get("test"),"message":e.get("message")})
              if r.get("fatal"):
                  errors.append({"run":r.get("run"),"fatal":r["fatal"]})
          summary={"run_count":len(reports),"runs":[{"run":r.get("run"),"passed":r.get("passed"),"failed":r.get("failed"),"skipped":r.get("skipped")} for r in reports],"errors":errors}
          Path("qa-context.txt").write_text("SUMMARY\n"+json.dumps(summary,ensure_ascii=False,indent=2)+"\n\nLOGS\n"+"\n".join(logs),encoding="utf-8")
          PY

      - name: Ask OpenAI for a minimal unified diff
        env:
          OPENAI_API_KEY: ${ secrets.OPENAI_API_KEY }
          OPENAI_MODEL: gpt-6.2-astra
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY repository secret is missing or unavailable."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          source=[]
          for name in ["index.html","tests/smoke.cjs"]:
              p=Path(name)
              if p.exists(): source.append("\n===== "+name+" =====\n"+p.read_text(encoding="utf-8"))
          prompt="""You are a senior frontend engineer diagnosing a failed Playwright mobile regression suite.
          Use report and logs as evidence. Propose the smallest safe fix.
          Output ONLY a git-apply-compatible unified diff, or exactly NO_SAFE_PATCH.
          Only change index.html or tests/smoke.cjs. Do not change workflows, weaken assertions,
          delete tests, add skips, alter the 10-run gate, or add dependencies. Prefer fixing product
          behavior over changing tests. If evidence is insufficient, output NO_SAFE_PATCH.
          QA REPORT AND LOGS:
          """+Path("qa-context.txt").read_text(encoding="utf-8")+"\n\nCURRENT SOURCE:\n"+"".join(source)
          Path("request.json").write_text(json.dumps({"model":os.environ["OPENAI_MODEL"],"instructions":"Return only a unified diff or NO_SAFE_PATCH. Never reveal secrets.","input":prompt,"max_output_tokens":5000,"store":False}),encoding="utf-8")
          PY
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" https://api.openai.com/v1/responses -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" --data-binary @request.json)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::OpenAI Responses API failed with HTTP $status"
            python3 -c 'import json; d=json.load(open("response.json")); print(json.dumps(d.get("error",d),ensure_ascii=False)[:4000])' || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open("response.json"))
          texts=[]
          for item in d.get("output",[]):
              if item.get("type")=="message":
                  for c in item.get("content",[]):
                      if c.get("type")=="output_text": texts.append(c.get("text",""))
          result="\n".join(texts).strip()
          if not result: raise SystemExit("Responses API returned no output_text")
          open("repair.patch","w",encoding="utf-8").write(result+"\n")
          PY

      - name: Validate and apply GPT patch
        id: patch
        run: |
          if grep -qx 'NO_SAFE_PATCH' repair.patch; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "## GPT diagnosis" >> "$GITHUB_STEP_SUMMARY"
            echo "GPT could not identify a safe evidence-based patch. No code was changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          grep -q '^diff --git a/' repair.patch || { echo "::error::GPT output is not a valid unified diff"; exit 1; }
          git apply --check repair.patch
          git apply repair.patch
          git diff --check
          for f in $(git diff --name-only); do
            case "$f" in index.html|tests/smoke.cjs) ;; *) echo "::error::Disallowed path in patch: $f"; exit 1;; esac
          done
          if git diff --quiet; then echo "created=false" >> "$GITHUB_OUTPUT"; else echo "created=true" >> "$GITHUB_OUTPUT"; fi

      - name: Create repair branch and pull request
        if: steps.patch.outputs.created == 'true'
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
          RUN_ID: ${ github.event.workflow_run.id }
          FAILED_SHA: ${ github.event.workflow_run.head_sha }
        run: |
          branch="gpt-repair/run-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add index.html tests/smoke.cjs
          git commit -m "fix: GPT QA repair for run $RUN_ID"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "GPT QA repair for failed run $RUN_ID" --body "Automated repair proposal based on QA run $RUN_ID, failed commit $FAILED_SHA. This PR triggers the 10-run mobile regression suite. Review the diff and CI results before merging; Pages deployment is disabled for pull_request events."

      - name: Publish diagnosis summary
        if: always()
        env:
          RUN_ID: ${ github.event.workflow_run.id }
          FAILED_SHA: ${ github.event.workflow_run.head_sha }
        run: |
          {
            echo "## GPT QA diagnosis and repair"
            echo "- Failed Run ID: $RUN_ID"
            echo "- Failed commit: $FAILED_SHA"
            if [ -f repair.patch ]; then
              if grep -qx 'NO_SAFE_PATCH' repair.patch; then echo "- Result: no safe patch proposed."; else echo "- Result: patch validated; PR creation attempted."; fi
            fi
            if [ -f response.json ]; then echo "- OpenAI Responses API returned a response."; fi
          } >> "$GITHUB_STEP_SUMMARY"
