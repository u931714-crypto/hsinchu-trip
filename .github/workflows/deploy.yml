name: Deploy Hsinchu Trip to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hsinchu-trip-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
