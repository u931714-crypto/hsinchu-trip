name: Deploy Hsinchu Trip Planner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript and required app structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          assert '<html lang="zh-Hant">' in html, "Traditional Chinese document language missing"
          for required in ['id="map"', 'id="list"', 'id="next"', 'id="undoBar"', 'id="pool"']:
              assert required in html, f"Required UI element missing: {required}"
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S | re.I)
          assert scripts, "No inline application script found"
          for i, script in enumerate(scripts):
              Path(f"/tmp/inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"HTML structure OK; extracted {len(scripts)} inline script(s)")
          PY
          for file in /tmp/inline-*.js; do node --check "$file"; done
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run mobile browser smoke tests
        run: |
          python3 -m http.server 4173 >/tmp/hsinchu-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          mkdir -p qa-reports
          for run in $(seq 1 10); do
            echo "===== Mobile regression run \${run}/10 ====="
            node tests/smoke.cjs | tee "qa-reports/run-\${run}.log"
            cp qa-report.json "qa-reports/run-\${run}.json"
          done
          python3 - <<'PY'
          import json, glob, os
          reports=[json.load(open(p)) for p in sorted(glob.glob("qa-reports/run-*.json"))]
          total=sum(r["passed"] for r in reports)
          skipped=sum(r["skipped"] for r in reports)
          with open("qa-reports/summary.json","w") as f:
              json.dump({"runs":len(reports),"passed_checks":total,"skipped_checks":skipped,"failed_runs":0},f,indent=2)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("# Hsinchu Trip QA - 10-run regression\n\n")
              f.write(f"- Runs: **{len(reports)}/10**\n- Passed checks: **{total}**\n- Skipped checks: **{skipped}**\n- Failed runs: **0**\n\n")
              f.write("Detailed JSON and logs are attached as the qa-report-10-runs artifact for GPT review.\n")
          PY
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-10-runs
          path: qa-reports/
          if-no-files-found: warn
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
